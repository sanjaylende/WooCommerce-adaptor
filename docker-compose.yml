# LEGACY. The adapter's data lives in its own schema (woocommerce_adapter) of the shared PostgreSQL database ltx_1jnl on
# 127.0.0.1:5432 (see README, "Database"). This container is not used any more (its volume was removed on 2026-10-15); the file is
# kept only so the legacy layout (schema public, docker/db-init) can be recreated if ever needed.
name: woocommerce-adaptor
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: adapter_owner
      POSTGRES_PASSWORD: adapter_owner_local
      POSTGRES_DB: woocommerce_adapter
    ports: ["127.0.0.1:5435:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata: {}
