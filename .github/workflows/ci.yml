name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: adapter_owner
          POSTGRES_PASSWORD: adapter_owner_local
          POSTGRES_DB: woocommerce_adapter
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U adapter_owner -d woocommerce_adapter"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node --check server.js
      - run: find src public -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Create the application database role
        run: PGPASSWORD=adapter_owner_local psql -h 127.0.0.1 -p 5435 -U adapter_owner -d woocommerce_adapter -f docker/db-init/01-app-role.sql
      - name: Lint the WordPress plugin
        run: find wordpress-plugin -name "*.php" -print0 | xargs -0 -n1 php -l
      - run: npm test
      # The Docker WooCommerce integration (infra/woocommerce/setup.sh + verify.js) is run by hand or nightly, not on every push.
