# Local WooCommerce for development and tests. Images are pinned so everyone gets the same stack.
#   docker compose --env-file .env up -d      (see README.md)
name: woocommerce-local

# wp-config.php evaluates this at runtime, so WP-CLI must see the same value as the web container.
x-wp-config-extra: &wp-config-extra |
      define('WP_HOME', '${WP_SITE_URL}');
      define('WP_SITEURL', '${WP_SITE_URL}');
      define('WP_DEBUG_LOG', true);
      define('WP_DEBUG_DISPLAY', false);
      define('WP_ENVIRONMENT_TYPE', 'local');
      define('FLIPICK_ADAPTER_URL', '${FLIPICK_ADAPTER_URL}');

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WP_DB_NAME}
      MARIADB_USER: ${WP_DB_USER}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.7-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:${WP_PORT}:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      # Lets the site answer on the configured URL whatever Host header reaches it (a tunnel, 127.0.0.1 or localhost).
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: *wp-config-extra
    volumes:
      - wpdata:/var/www/html
      # The plugin under development is mounted live, so edits show up without rebuilding anything.
      - ../../wordpress-plugin/flipick-video-generator:/var/www/html/wp-content/plugins/flipick-video-generator

  # WP-CLI shares the WordPress files and database; started on demand by setup.sh (profile "tools").
  wpcli:
    image: wordpress:cli-2.11-php8.3
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: *wp-config-extra
      HOME: /tmp
    volumes:
      - wpdata:/var/www/html
      - ../../wordpress-plugin/flipick-video-generator:/var/www/html/wp-content/plugins/flipick-video-generator
      - ./seed:/seed:ro

  phpmyadmin:
    image: phpmyadmin:5.2
    profiles: ["tools"]
    ports: ["127.0.0.1:${PMA_PORT}:80"]
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${WP_DB_ROOT_PASSWORD}

volumes:
  dbdata: {}
  wpdata: {}
